name: Build
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q .github/workflows/Mirrox-v4-1.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
        working-directory: Mirrox
      - uses: actions/upload-artifact@v4
        with: { name: Mirrox-debug-apk, path: Mirrox/app/build/outputs/apk/debug/app-debug.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive .github/workflows/Mirrox-v4-1.zip -DestinationPath .
        shell: pwsh
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
        working-directory: Mirrox/windows
      - run: python -m unittest discover -p "test_*.py"
        working-directory: Mirrox/windows
      - run: pyinstaller --onefile --noconsole --name MirroxPC --collect-all zeroconf --collect-all qrcode --collect-all cryptography --collect-all av mirrox_pc.py
        working-directory: Mirrox/windows
      - uses: actions/upload-artifact@v4
        with: { name: MirroxPC-windows, path: Mirrox/windows/dist/MirroxPC.exe }
